<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Felices tres meses, amor mío</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: Georgia, "Times New Roman", serif;
        }

        #contenedor {
            width: 100vw;
            height: 100vh;
        }

        /* ========================================
           TITULO
        ======================================== */

        #titulo {
            position: fixed;
            top: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffffff;
            z-index: 20;
            pointer-events: none;
            text-shadow:
                0 0 8px #ffffff,
                0 0 18px #35fff3,
                0 0 35px #00d9cc,
                0 0 65px #00aaa0;
        }

        #titulo h1 {
            font-family: "Trebuchet MS", Arial, sans-serif;
            font-size: 31px;
            font-weight: 400;
            letter-spacing: 3px;
        }

        #titulo .corazonTitulo {
            display: block;
            margin-top: 4px;
            font-size: 38px;
            color: #35fff3;
            text-shadow:
                0 0 10px #ffffff,
                0 0 20px #35fff3,
                0 0 40px #00d9cc;
            animation: latido 1.5s infinite ease-in-out;
        }

        #titulo p {
            margin-top: 4px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            opacity: .75;
        }

        @keyframes latido {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

        }

        /* ========================================
           AYUDA
        ======================================== */

        #ayuda {
            position: fixed;
            right: 18px;
            bottom: 18px;
            color: #dffffd;
            font-family: Arial, sans-serif;
            font-size: 11px;
            opacity: .5;
            z-index: 20;
            text-shadow: 0 0 8px #00fff0;
        }

        /* ========================================
           SOBRE / MENSAJE
        ======================================== */

        #mensajePantalla {

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 80, 80, .35),
                    rgba(0, 0, 5, .97)
                );

            backdrop-filter: blur(15px);

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 100;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .5s ease,
                visibility .5s ease;

        }

        #mensajePantalla.visible {

            opacity: 1;

            visibility: visible;

        }

        /* ========================================
           CARTA
        ======================================== */

        .sobre {

            position: relative;

            width: min(650px, 88vw);

            min-height: 400px;

            padding: 70px 55px 55px;

            background:
                linear-gradient(
                    145deg,
                    #ecffff,
                    #ccefeb
                );

            color: #163b3a;

            border-radius: 10px;

            border: 1px solid rgba(53,255,243,.4);

            box-shadow:
                0 0 30px rgba(255,255,255,.15),
                0 0 80px rgba(0,255,240,.3),
                0 0 150px rgba(0,180,170,.2);

            transform:
                scale(.4)
                rotateX(35deg);

            opacity: 0;

            transition:
                transform .8s cubic-bezier(.2,.8,.2,1),
                opacity .6s ease;

        }

        #mensajePantalla.visible .sobre {

            transform:
                scale(1)
                rotateX(0deg);

            opacity: 1;

        }

        /* ========================================
           PAPEL
        ======================================== */

        .papel {
            text-align: center;
        }

        .papel .pequeno {

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 4px;

            color: #357c79;

            text-transform: uppercase;

            margin-bottom: 25px;

        }

        .papel h2 {

            font-size: 32px;

            font-weight: normal;

            margin-bottom: 30px;

            color: #164e4b;

        }

        .papel p {

            font-size: 22px;

            line-height: 1.7;

        }

        /* ========================================
           SELLO
        ======================================== */

        .sello {

            position: absolute;

            top: 25px;

            right: 30px;

            width: 55px;

            height: 55px;

            border-radius: 50%;

            background: #00bdb0;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            box-shadow:
                0 0 15px rgba(0,255,240,.5);

        }

        /* ========================================
           CERRAR
        ======================================== */

        #cerrarMensaje {

            position: absolute;

            top: 20px;

            left: 25px;

            width: 35px;

            height: 35px;

            border: none;

            border-radius: 50%;

            background: rgba(30,90,90,.1);

            color: #164e4b;

            font-size: 20px;

            cursor: pointer;

        }

        #cerrarMensaje:hover {

            background: rgba(30,90,90,.25);

        }

        /* ========================================
           TEXTO FLOTANTE
        ======================================== */

        .frase {

            position: fixed;

            color: rgba(150,255,250,.8);

            font-family: Georgia, serif;

            font-size: 15px;

            font-style: italic;

            pointer-events: none;

            z-index: 5;

            text-shadow:
                0 0 5px #ffffff,
                0 0 12px #00fff0,
                0 0 25px #00bdb0;

            animation:
                flotarFrase 5s ease-in-out infinite;

        }

        .frase1 {
            left: 5%;
            top: 42%;
            animation-delay: 0s;
        }

        .frase2 {
            right: 5%;
            top: 48%;
            animation-delay: 1.2s;
        }

        .frase3 {
            left: 9%;
            top: 67%;
            animation-delay: 2.1s;
        }

        .frase4 {
            right: 8%;
            top: 70%;
            animation-delay: 3s;
        }

        @keyframes flotarFrase {

            0%, 100% {
                transform: translateY(0);
                opacity: .55;
            }

            50% {
                transform: translateY(-12px);
                opacity: 1;
            }

        }

        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 600px) {

            #titulo {
                top: 18px;
            }

            #titulo h1 {
                font-size: 22px;
                letter-spacing: 2px;
                padding: 0 15px;
            }

            #titulo .corazonTitulo {
                font-size: 32px;
            }

            #titulo p {
                font-size: 9px;
                letter-spacing: 2px;
            }

            .sobre {

                padding:
                    65px
                    28px
                    40px;

                min-height: 350px;

            }

            .papel h2 {
                font-size: 25px;
            }

            .papel p {
                font-size: 18px;
            }

            .frase {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


<div id="contenedor"></div>


<!-- ========================================
     TITULO
======================================== -->

<div id="titulo">

    <h1>
        Felices tres meses, amor mío.
    </h1>

    <span class="corazonTitulo">
        ♥
    </span>

    <p>
        Tres meses de nosotros
    </p>

</div>


<!-- ========================================
     FRASES
======================================== -->

<div class="frase frase1">
    Eres mi lugar favorito.
</div>

<div class="frase frase2">
    Mi universo eres tú.
</div>

<div class="frase frase3">
    Gracias por estos tres meses.
</div>

<div class="frase frase4">
    Y por todos los que nos faltan.
</div>


<!-- ========================================
     AYUDA
======================================== -->

<div id="ayuda">

    Arrastra para explorar ·
    Acerca o aleja ·
    Toca las estrellas ✦

</div>


<!-- ========================================
     MENSAJE
======================================== -->

<div id="mensajePantalla">

    <div class="sobre">

        <button id="cerrarMensaje">
            ×
        </button>

        <div class="sello">
            ♥
        </div>

        <div class="papel">

            <div class="pequeno">
                Un mensaje para ti
            </div>

            <h2>
                Felices tres meses
            </h2>

            <p id="textoMensaje">
            </p>

        </div>

    </div>

</div>


<!-- ========================================
     THREE.JS
======================================== -->

<script type="importmap">

{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}

</script>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* ========================================
   ESCENA
======================================== */

const escena =
    new THREE.Scene();

escena.background =
    new THREE.Color(0x000304);

escena.fog =
    new THREE.FogExp2(
        0x000304,
        0.0008
    );


/* ========================================
   CÁMARA
======================================== */

const camara =
    new THREE.PerspectiveCamera(

        60,

        window.innerWidth /
        window.innerHeight,

        .1,

        5000

    );

camara.position.set(
    0,
    120,
    700
);


/* ========================================
   RENDERER
======================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: false

    });

renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
    .getElementById("contenedor")
    .appendChild(renderer.domElement);


/* ========================================
   CONTROLES
======================================== */

const controles =
    new OrbitControls(
        camara,
        renderer.domElement
    );

controles.enableDamping = true;

controles.dampingFactor = .035;

controles.enablePan = false;

controles.minDistance = 180;

controles.maxDistance = 1200;

controles.autoRotate = true;

controles.autoRotateSpeed = .15;


/* ========================================
   LUZ TURQUESA
======================================== */

const luz =
    new THREE.PointLight(
        0x45fff4,
        8,
        1200
    );

escena.add(luz);


/* ========================================
   LUZ CENTRAL BLANCA
======================================== */

const luzBlanca =
    new THREE.PointLight(
        0xffffff,
        5,
        500
    );

escena.add(luzBlanca);


/* ========================================
   TEXTURA DE HALO
======================================== */

function crearHalo() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 128;
    canvas.height = 128;

    const contexto =
        canvas.getContext("2d");

    const gradiente =
        contexto.createRadialGradient(
            64,
            64,
            0,
            64,
            64,
            64
        );

    gradiente.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradiente.addColorStop(
        .08,
        "rgba(255,255,255,1)"
    );

    gradiente.addColorStop(
        .25,
        "rgba(80,255,245,.9)"
    );

    gradiente.addColorStop(
        .55,
        "rgba(0,220,210,.35)"
    );

    gradiente.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    contexto.fillStyle =
        gradiente;

    contexto.fillRect(
        0,
        0,
        128,
        128
    );

    return new THREE.CanvasTexture(
        canvas
    );

}

const texturaHalo =
    crearHalo();


/* ========================================
   CORAZÓN DE PARTÍCULAS
======================================== */

const cantidadCorazon = 10000;

const posicionesCorazon =
    new Float32Array(
        cantidadCorazon * 3
    );

const coloresCorazon =
    new Float32Array(
        cantidadCorazon * 3
    );


for (
    let i = 0;
    i < cantidadCorazon;
    i++
) {

    const t =
        Math.random() *
        Math.PI *
        2;

    const escala =
        12 +
        Math.random() * 4;

    const ruido =
        (Math.random() - .5) *
        7;

    /*
        Fórmula clásica del corazón.
    */

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13 *
        Math.cos(t)
        - 5 *
        Math.cos(2 * t)
        - 2 *
        Math.cos(3 * t)
        - Math.cos(4 * t);

    const profundidad =
        (Math.random() - .5) *
        18;


    posicionesCorazon[i * 3] =
        x * escala + ruido;

    posicionesCorazon[i * 3 + 1] =
        y * escala + ruido;

    posicionesCorazon[i * 3 + 2] =
        profundidad;


    /*
        Color turquesa con pequeñas
        variaciones.
    */

    coloresCorazon[i * 3] =
        .05 + Math.random() * .15;

    coloresCorazon[i * 3 + 1] =
        .75 + Math.random() * .25;

    coloresCorazon[i * 3 + 2] =
        .70 + Math.random() * .30;

}


const corazonGeometry =
    new THREE.BufferGeometry();

corazonGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        posicionesCorazon,
        3
    )

);

corazonGeometry.setAttribute(

    "color",

    new THREE.BufferAttribute(
        coloresCorazon,
        3
    )

);


const corazonMaterial =
    new THREE.PointsMaterial({

        size: 2.5,

        vertexColors: true,

        transparent: true,

        opacity: .95,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false

    });


const corazon =
    new THREE.Points(

        corazonGeometry,

        corazonMaterial

    );


corazon.scale.set(
    1.5,
    1.5,
    1.5
);

escena.add(corazon);


/* ========================================
   HALO DEL CORAZÓN
======================================== */

const haloCorazon =
    new THREE.Sprite(

        new THREE.SpriteMaterial({

            map: texturaHalo,

            color: 0x00fff0,

            transparent: true,

            opacity: .18,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false

        })

    );

haloCorazon.scale.set(
    700,
    700,
    1
);

escena.add(haloCorazon);


/* ========================================
   PEQUEÑOS CORAZONES
======================================== */

const corazonesPequenos = [];


for (
    let i = 0;
    i < 45;
    i++
) {

    const sprite =
        new THREE.Sprite(

            new THREE.SpriteMaterial({

                map: texturaHalo,

                color: 0x48fff3,

                transparent: true,

                opacity: .65,

                blending:
                    THREE.AdditiveBlending,

                depthWrite: false

            })

        );


    const angulo =
        Math.random() *
        Math.PI * 2;

    const radio =
        250 +
        Math.random() * 450;


    sprite.position.set(

        Math.cos(angulo) * radio,

        (Math.random() - .5) * 500,

        Math.sin(angulo) * radio

    );


    const tamaño =
        12 +
        Math.random() * 20;

    sprite.scale.set(
        tamaño,
        tamaño,
        1
    );


    sprite.userData.velocidad =
        .3 +
        Math.random() * .8;

    sprite.userData.fase =
        Math.random() * 10;


    escena.add(sprite);

    corazonesPequenos.push(sprite);

}


/* ========================================
   ESTRELLAS DEL FONDO
======================================== */

const cantidadFondo =
    7000;

const posicionesFondo =
    new Float32Array(
        cantidadFondo * 3
    );


for (
    let i = 0;
    i < cantidadFondo;
    i++
) {

    const radio =
        700 +
        Math.random() * 1800;

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    posicionesFondo[i * 3] =
        radio *
        Math.sin(phi) *
        Math.cos(theta);

    posicionesFondo[i * 3 + 1] =
        radio *
        Math.sin(phi) *
        Math.sin(theta);

    posicionesFondo[i * 3 + 2] =
        radio *
        Math.cos(phi);

}


const fondoGeometry =
    new THREE.BufferGeometry();

fondoGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(
        posicionesFondo,
        3
    )

);


const fondoMaterial =
    new THREE.PointsMaterial({

        color: 0x8ffff8,

        size: 1.7,

        transparent: true,

        opacity: .7

    });


const fondo =
    new THREE.Points(

        fondoGeometry,

        fondoMaterial

    );

escena.add(fondo);


/* ========================================
   FOTOS
======================================== */

const nombresFotos = [

    "foto1.jpg",
    "foto2.jpg",
    "foto3.jpg",
    "foto4.jpg",
    "foto5.jpg",
    "foto6.jpg"

];


const datosFotos = [

    {
        radio: 300,
        altura: 120,
        velocidad: .0018,
        escala: 1
    },

    {
        radio: 420,
        altura: -80,
        velocidad: .0011,
        escala: .9
    },

    {
        radio: 560,
        altura: 180,
        velocidad: .0008,
        escala: .82
    },

    {
        radio: 700,
        altura: -160,
        velocidad: .0006,
        escala: .75
    },

    {
        radio: 350,
        altura: -200,
        velocidad: .0015,
        escala: .95
    },

    {
        radio: 480,
        altura: 230,
        velocidad: .001,
        escala: .85
    },

    {
        radio: 620,
        altura: 40,
        velocidad: .0007,
        escala: .8
    },

    {
        radio: 760,
        altura: -100,
        velocidad: .0005,
        escala: .7
    },

    {
        radio: 280,
        altura: 260,
        velocidad: .002,
        escala: 1.05
    },

    {
        radio: 530,
        altura: -250,
        velocidad: .0009,
        escala: .82
    },

    {
        radio: 680,
        altura: 220,
        velocidad: .0006,
        escala: .72
    },

    {
        radio: 820,
        altura: -220,
        velocidad: .0004,
        escala: .65
    },

    {
        radio: 390,
        altura: 300,
        velocidad: .0013,
        escala: .92
    },

    {
        radio: 580,
        altura: -300,
        velocidad: .0008,
        escala: .78
    },

    {
        radio: 730,
        altura: 280,
        velocidad: .0005,
        escala: .68
    },

    {
        radio: 450,
        altura: 100,
        velocidad: .0011,
        escala: .88
    },

    {
        radio: 650,
        altura: -40,
        velocidad: .0007,
        escala: .76
    },

    {
        radio: 850,
        altura: 150,
        velocidad: .0004,
        escala: .62
    },

    {
        radio: 320,
        altura: -120,
        velocidad: .0017,
        escala: .98
    },

    {
        radio: 500,
        altura: 260,
        velocidad: .0009,
        escala: .84
    }

];


const grupoFotos =
    new THREE.Group();

escena.add(
    grupoFotos
);


const fotosObjetos = [];


/* ========================================
   CREAR FOTOS
======================================== */

datosFotos.forEach(

    (datos, indice) => {

        const archivo =
            nombresFotos[
                indice %
                nombresFotos.length
            ];


        const textura =
            new THREE.TextureLoader().load(
                "fotos/" + archivo
            );


        const grupo =
            new THREE.Group();


        grupo.userData.angulo =
            Math.random() *
            Math.PI * 2;

        grupo.userData.radio =
            datos.radio;

        grupo.userData.altura =
            datos.altura;

        grupo.userData.velocidad =
            datos.velocidad;


        grupo.scale.setScalar(
            datos.escala
        );


        /* FOTO */

        const geometria =
            new THREE.PlaneGeometry(
                75,
                75
            );


        const material =
            new THREE.MeshBasicMaterial({

                map: textura,

                side:
                    THREE.DoubleSide,

                transparent: true,

                opacity: .95

            });


        const foto =
            new THREE.Mesh(
                geometria,
                material
            );


        grupo.add(foto);


        /* HALO */

        const halo =
            new THREE.Sprite(

                new THREE.SpriteMaterial({

                    map:
                        texturaHalo,

                    color:
                        0x35fff3,

                    transparent:
                        true,

                    opacity:
                        .16,

                    blending:
                        THREE.AdditiveBlending,

                    depthWrite:
                        false

                })

            );


        halo.scale.set(
            105,
            105,
            1
        );


        grupo.add(halo);


        grupo.userData.foto =
            foto;

        grupo.userData.halo =
            halo;


        grupoFotos.add(
            grupo
        );

        fotosObjetos.push(
            grupo
        );

    }

);


/* ========================================
   ESTRELLAS INTERACTIVAS
======================================== */

const recuerdos = [

    "Desde que llegaste, mi universo cambió.",

    "Entre millones de personas, tuve la suerte de encontrarte.",

    "Mi lugar favorito siempre termina siendo contigo.",

    "Estos tres meses se sienten como el comienzo de algo muy bonito.",

    "Gracias por cada sonrisa, cada momento y cada recuerdo.",

    "Me encanta imaginar todos los momentos que todavía nos faltan vivir.",

    "Si pudiera guardar un momento para siempre, elegiría uno contigo.",

    "Hay recuerdos que brillan más que cualquier estrella.",

    "Tú eres una de las partes más bonitas de mi universo.",

    "Ojalá podamos seguir escribiendo nuestra historia juntos.",

    "Cada momento contigo se convirtió en una pequeña parte de mi universo.",

    "No sé qué nos espera más adelante, pero me hace ilusión descubrirlo contigo.",

    "De todas las coincidencias de la vida, conocerte fue mi favorita.",

    "A veces miro las estrellas y pienso en lo bonito que fue encontrarte.",

    "Nuestra historia todavía tiene muchas estrellas por descubrir.",

    "Gracias por estos tres meses, amor mío.",

    "Mi universo tiene millones de puntos de luz, pero tú siempre destacas.",

    "Felices tres meses. Y que sean muchos más."

];


const posicionesEstrellas = [

    [-250, 90, 130],
    [-170, 190, -180],
    [-50, 110, 330],
    [120, 160, -280],
    [250, 100, 180],
    [320, 0, -120],
    [260, -130, 260],
    [80, -170, -320],
    [-100, -200, 270],
    [-270, -140, -220],
    [-350, 50, 40],
    [-320, 220, 100],
    [-80, 300, 150],
    [100, 270, -170],
    [230, 220, 30],
    [370, 120, -250],
    [380, -100, -80],
    [-380, -80, 180]

];


const estrellasEspeciales = [];


/* ========================================
   CREAR ESTRELLAS
======================================== */

posicionesEstrellas.forEach(

    (posicion, indice) => {

        const grupo =
            new THREE.Group();


        grupo.position.set(
            posicion[0],
            posicion[1],
            posicion[2]
        );


        grupo.userData.texto =
            recuerdos[indice];


        const halo =
            new THREE.Sprite(

                new THREE.SpriteMaterial({

                    map:
                        texturaHalo,

                    color:
                        0x55fff5,

                    transparent:
                        true,

                    opacity:
                        .9,

                    blending:
                        THREE.AdditiveBlending,

                    depthWrite:
                        false

                })

            );


        halo.scale.set(
            42,
            42,
            1
        );


        grupo.add(halo);


        const nucleo =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    5,
                    16,
                    16
                ),

                new THREE.MeshBasicMaterial({

                    color:
                        0xffffff

                })

            );


        grupo.add(nucleo);


        const materialCruz =
            new THREE.LineBasicMaterial({

                color:
                    0xbafff9,

                transparent:
                    true,

                opacity:
                    .8

            });


        const puntosCruz = [

            new THREE.Vector3(
                -16, 0, 0
            ),

            new THREE.Vector3(
                16, 0, 0
            ),

            new THREE.Vector3(
                0, -16, 0
            ),

            new THREE.Vector3(
                0, 16, 0
            )

        ];


        const geometriaCruz =
            new THREE.BufferGeometry()
                .setFromPoints(
                    puntosCruz
                );


        const cruz =
            new THREE.LineSegments(

                geometriaCruz,

                materialCruz

            );


        grupo.add(cruz);


        grupo.userData.halo =
            halo;

        grupo.userData.nucleo =
            nucleo;

        grupo.userData.cruz =
            cruz;


        escena.add(grupo);

        estrellasEspeciales.push(
            grupo
        );

    }

);


/* ========================================
   RAYCASTER
======================================== */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


function obtenerMouse(event) {

    mouse.x =
        (event.clientX /
        window.innerWidth) *
        2 - 1;

    mouse.y =
        -(event.clientY /
        window.innerHeight) *
        2 + 1;

}


/* ========================================
   MENSAJE
======================================== */

const pantallaMensaje =
    document.getElementById(
        "mensajePantalla"
    );


const textoMensaje =
    document.getElementById(
        "textoMensaje"
    );


function abrirMensaje(texto) {

    textoMensaje.innerText =
        texto;

    pantallaMensaje.classList.add(
        "visible"
    );

    controles.enabled =
        false;

}


/* ========================================
   CLIC / TOQUE
======================================== */

renderer.domElement.addEventListener(

    "pointerdown",

    function(event) {

        obtenerMouse(event);

        raycaster.setFromCamera(
            mouse,
            camara
        );


        const objetos =
            raycaster.intersectObjects(
                estrellasEspeciales,
                true
            );


        if (
            objetos.length > 0
        ) {

            let estrella =
                objetos[0].object;


            while (
                estrella.parent &&
                !estrella.userData.texto
            ) {

                estrella =
                    estrella.parent;

            }


            if (
                estrella.userData.texto
            ) {

                abrirMensaje(
                    estrella.userData.texto
                );

            }

        }

    }

);


/* ========================================
   CERRAR
======================================== */

document
    .getElementById(
        "cerrarMensaje"
    )
    .addEventListener(

        "click",

        function() {

            pantallaMensaje
                .classList
                .remove("visible");

            controles.enabled =
                true;

        }

    );


window.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Escape"
        ) {

            pantallaMensaje
                .classList
                .remove("visible");

            controles.enabled =
                true;

        }

    }

);


/* ========================================
   ANIMACIÓN
======================================== */

const reloj =
    new THREE.Clock();


function animar() {

    requestAnimationFrame(
        animar
    );


    const tiempo =
        reloj.getElapsedTime();


    /* CORAZÓN */

    const pulso =
        1 +
        Math.sin(
            tiempo * 1.8
        ) * .035;


    corazon.scale.set(
        1.5 * pulso,
        1.5 * pulso,
        1.5 * pulso
    );


    corazon.rotation.y =
        Math.sin(
            tiempo * .25
        ) * .08;


    /* HALO */

    const pulsoHalo =
        1 +
        Math.sin(
            tiempo * 1.4
        ) * .08;


    haloCorazon.scale.set(
        700 * pulsoHalo,
        700 * pulsoHalo,
        1
    );


    haloCorazon.material.opacity =
        .13 +
        Math.sin(
            tiempo * 1.5
        ) * .05;


    /* FONDO */

    fondo.rotation.y =
        tiempo * .0015;


    /* PEQUEÑOS CORAZONES */

    corazonesPequenos.forEach(

        (corazonPequeno) => {

            corazonPequeno.position.y +=
                corazonPequeno.userData.velocidad;

            corazonPequeno.material.opacity =
                .35 +
                Math.sin(
                    tiempo * 1.5 +
                    corazonPequeno.userData.fase
                ) * .3;


            if (
                corazonPequeno.position.y >
                350
            ) {

                corazonPequeno.position.y =
                    -350;

            }

        }

    );


    /* FOTOS */

    fotosObjetos.forEach(

        (foto, indice) => {

            foto.userData.angulo +=
                foto.userData.velocidad;


            const angulo =
                foto.userData.angulo;


            const radio =
                foto.userData.radio;


            const x =
                Math.cos(angulo) *
                radio;


            const z =
                Math.sin(angulo) *
                radio;


            const y =
                foto.userData.altura +
                Math.sin(angulo) *
                radio *
                .12;


            foto.position.set(
                x,
                y,
                z
            );


            foto.lookAt(
                camara.position
            );


            const brillo =
                1 +
                Math.sin(
                    tiempo * 1.3 +
                    indice
                ) * .06;


            foto.userData.halo
                .scale.set(
                    105 * brillo,
                    105 * brillo,
                    1
                );

        }

    );


    /* ESTRELLAS */

    estrellasEspeciales.forEach(

        (estrella, indice) => {

            const pulsoEstrella =
                1 +
                Math.sin(
                    tiempo * 2.2 +
                    indice
                ) * .18;


            estrella.userData.halo
                .scale.set(
                    42 * pulsoEstrella,
                    42 * pulsoEstrella,
                    1
                );


            estrella.userData.nucleo
                .scale.setScalar(
                    pulsoEstrella
                );


            estrella.userData.cruz
                .scale.setScalar(
                    pulsoEstrella
                );


            estrella.rotation.z =
                tiempo *
                (.2 + indice * .01);

        }

    );


    controles.update();


    renderer.render(
        escena,
        camara
    );

}


animar();


/* ========================================
   RESPONSIVE
======================================== */

window.addEventListener(

    "resize",

    function() {

        camara.aspect =
            window.innerWidth /
            window.innerHeight;

        camara.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }

);

</script>

</body>

</html>
