<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Felices tres meses, amor mío.</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: Georgia, "Times New Roman", serif;
        }

        #contenedor {
            width: 100vw;
            height: 100vh;
        }

        /* ========================================
           TITULO
        ======================================== */

        #titulo {

            position: fixed;

            top: 28px;

            left: 0;

            width: 100%;

            text-align: center;

            color: white;

            z-index: 20;

            pointer-events: none;

            text-shadow:

                0 0 10px white,
                0 0 22px #5fcaff,
                0 0 45px #168cff,
                0 0 70px #075dcc;

        }

        #titulo h1 {

            font-family:
                "Trebuchet MS",
                Arial,
                sans-serif;

            font-size: 29px;

            font-weight: 300;

            letter-spacing: 3px;

        }

        #titulo .corazon {

            display: block;

            margin-top: 3px;

            font-size: 35px;

            color: #54cfff;

            text-shadow:

                0 0 10px white,
                0 0 20px #54cfff,
                0 0 40px #168cff;

            animation:
                latido 1.5s infinite ease-in-out;

        }

        #titulo p {

            margin-top: 3px;

            font-family: Arial, sans-serif;

            font-size: 11px;

            opacity: .7;

            letter-spacing: 3px;

        }

        @keyframes latido {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.13);
            }

        }

        /* ========================================
           FRASES
        ======================================== */

        .frase {

            position: fixed;

            color:
                rgba(170, 225, 255, .75);

            font-family:
                Georgia,
                serif;

            font-size: 14px;

            font-style: italic;

            pointer-events: none;

            z-index: 5;

            text-shadow:

                0 0 5px white,
                0 0 12px #45bfff,
                0 0 25px #167cff;

            animation:
                flotar 5s ease-in-out infinite;

        }

        .frase1 {

            left: 5%;

            top: 42%;

        }

        .frase2 {

            right: 5%;

            top: 48%;

            animation-delay: 1.2s;

        }

        .frase3 {

            left: 7%;

            top: 68%;

            animation-delay: 2s;

        }

        .frase4 {

            right: 7%;

            top: 70%;

            animation-delay: 3s;

        }

        @keyframes flotar {

            0%, 100% {

                transform:
                    translateY(0);

                opacity: .45;

            }

            50% {

                transform:
                    translateY(-10px);

                opacity: .9;

            }

        }

        /* ========================================
           AYUDA
        ======================================== */

        #ayuda {

            position: fixed;

            right: 18px;

            bottom: 18px;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 11px;

            opacity: .45;

            z-index: 20;

            text-shadow:
                0 0 8px #299fff;

        }

        /* ========================================
           MENSAJE
        ======================================== */

        #mensajePantalla {

            position: fixed;

            inset: 0;

            background:

                radial-gradient(
                    circle at center,
                    rgba(25, 70, 130, .35),
                    rgba(0, 0, 10, .97)
                );

            backdrop-filter:
                blur(15px);

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 100;

            opacity: 0;

            visibility: hidden;

            transition:

                opacity .5s ease,
                visibility .5s ease;

        }

        #mensajePantalla.visible {

            opacity: 1;

            visibility: visible;

        }

        /* ========================================
           CARTA
        ======================================== */

        .sobre {

            position: relative;

            width:
                min(650px, 88vw);

            min-height: 400px;

            padding:
                70px 55px 55px;

            background:

                linear-gradient(
                    145deg,
                    #edf8ff,
                    #d7e8f3
                );

            color: #203044;

            border-radius: 9px;

            box-shadow:

                0 0 30px
                    rgba(255,255,255,.15),

                0 0 100px
                    rgba(50,160,255,.25);

            transform:

                scale(.4)
                rotateX(35deg);

            opacity: 0;

            transition:

                transform .8s
                    cubic-bezier(.2,.8,.2,1),

                opacity .6s ease;

        }

        #mensajePantalla.visible .sobre {

            transform:

                scale(1)
                rotateX(0deg);

            opacity: 1;

        }

        .papel {

            text-align: center;

        }

        .papel .pequeno {

            font-family:
                Arial,
                sans-serif;

            font-size: 12px;

            letter-spacing: 4px;

            color: #57748e;

            text-transform:
                uppercase;

            margin-bottom: 25px;

        }

        .papel h2 {

            font-size: 32px;

            font-weight: normal;

            margin-bottom: 30px;

            color: #29445c;

        }

        .papel p {

            font-size: 22px;

            line-height: 1.7;

        }

        /* ========================================
           SELLO
        ======================================== */

        .sello {

            position: absolute;

            top: 25px;

            right: 30px;

            width: 55px;

            height: 55px;

            border-radius: 50%;

            background: #208ed4;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            box-shadow:

                0 0 20px
                rgba(40,170,255,.45);

        }

        /* ========================================
           BOTON
        ======================================== */

        #cerrarMensaje {

            position: absolute;

            top: 20px;

            left: 25px;

            width: 35px;

            height: 35px;

            border: none;

            border-radius: 50%;

            background:
                rgba(40,70,90,.1);

            color: #40566c;

            font-size: 20px;

            cursor: pointer;

        }

        #cerrarMensaje:hover {

            background:
                rgba(40,70,90,.2);

        }

        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 600px) {

            #titulo {

                top: 20px;

            }

            #titulo h1 {

                font-size: 21px;

                letter-spacing: 1px;

                padding: 0 10px;

            }

            #titulo .corazon {

                font-size: 31px;

            }

            #titulo p {

                font-size: 9px;

            }

            .sobre {

                padding:
                    65px 28px 40px;

                min-height: 350px;

            }

            .papel h2 {

                font-size: 25px;

            }

            .papel p {

                font-size: 18px;

            }

            .frase {

                font-size: 10px;

            }

        }

    </style>

</head>


<body>


<div id="contenedor"></div>


<div id="titulo">

    <h1>
        Felices tres meses, amor mío.
    </h1>

    <span class="corazon">
        ♥
    </span>

    <p>
        Nuestro pequeño universo
    </p>

</div>


<div class="frase frase1">
    Eres mi lugar favorito.
</div>

<div class="frase frase2">
    Mi universo eres tú.
</div>

<div class="frase frase3">
    Gracias por estos tres meses.
</div>

<div class="frase frase4">
    Y por todos los que nos faltan.
</div>


<div id="ayuda">

    Arrastra para explorar ·
    Acerca o aleja ·
    Toca las estrellas ✦

</div>


<!-- ========================================
     MENSAJE
======================================== -->

<div id="mensajePantalla">

    <div class="sobre">

        <button id="cerrarMensaje">
            ×
        </button>

        <div class="sello">
            ♥
        </div>

        <div class="papel">

            <div class="pequeno">
                Un mensaje para ti
            </div>

            <h2>
                Felices tres meses
            </h2>

            <p id="textoMensaje">
            </p>

        </div>

    </div>

</div>


<!-- ========================================
     THREE.JS
======================================== -->

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE
    from "three";


import {
    OrbitControls
}
from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* ========================================
   ESCENA
======================================== */

const escena =
    new THREE.Scene();


escena.background =
    new THREE.Color(
        0x000005
    );


escena.fog =
    new THREE.FogExp2(
        0x000005,
        0.0007
    );


/* ========================================
   CÁMARA
======================================== */

const camara =
    new THREE.PerspectiveCamera(

        60,

        window.innerWidth /
        window.innerHeight,

        .1,

        5000

    );


camara.position.set(
    0,
    170,
    650
);


/* ========================================
   RENDERER
======================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: false

    });


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


document
    .getElementById(
        "contenedor"
    )
    .appendChild(
        renderer.domElement
    );


/* ========================================
   CONTROLES
======================================== */

const controles =
    new OrbitControls(

        camara,

        renderer.domElement

    );


controles.enableDamping =
    true;

controles.dampingFactor =
    .035;

controles.enablePan =
    false;

controles.minDistance =
    180;

controles.maxDistance =
    1200;

controles.autoRotate =
    true;

controles.autoRotateSpeed =
    .16;


/* ========================================
   LUZ CENTRAL
======================================== */

const luz =
    new THREE.PointLight(

        0xffffff,

        7,

        900

    );

escena.add(luz);


/* ========================================
   PLANETA ORIGINAL
======================================== */

const texturaLoader =
    new THREE.TextureLoader();


let planeta;


texturaLoader.load(

    "fotos/planeta.jpg",

    function(textura) {

        const geometria =
            new THREE.SphereGeometry(

                70,

                64,

                64

            );


        const material =
            new THREE.MeshStandardMaterial({

                map:
                    textura,

                roughness:
                    .75,

                metalness:
                    .1

            });


        planeta =
            new THREE.Mesh(

                geometria,

                material

            );


        escena.add(
            planeta
        );

    }

);


/* ========================================
   ATMÓSFERA
======================================== */

const atmosfera =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            75,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:
                0x3b8cff,

            transparent:
                true,

            opacity:
                .14,

            side:
                THREE.BackSide

        })

    );


escena.add(
    atmosfera
);


/* ========================================
   ANILLOS
======================================== */

const anillo =
    new THREE.Mesh(

        new THREE.RingGeometry(

            100,

            128,

            160

        ),

        new THREE.MeshBasicMaterial({

            color:
                0x69cfff,

            transparent:
                true,

            opacity:
                .45,

            side:
                THREE.DoubleSide

        })

    );


anillo.rotation.x =
    Math.PI / 2.4;


escena.add(
    anillo
);


/* ========================================
   GALAXIA DE FONDO
======================================== */

const cantidadFondo =
    8000;


const posicionesFondo =
    new Float32Array(

        cantidadFondo * 3

    );


for (

    let i = 0;

    i < cantidadFondo;

    i++

) {

    const radio =

        900 +
        Math.random() * 1800;


    const theta =

        Math.random() *
        Math.PI * 2;


    const phi =

        Math.acos(

            2 *
            Math.random() -
            1

        );


    posicionesFondo[i * 3] =

        radio *
        Math.sin(phi) *
        Math.cos(theta);


    posicionesFondo[i * 3 + 1] =

        radio *
        Math.sin(phi) *
        Math.sin(theta);


    posicionesFondo[i * 3 + 2] =

        radio *
        Math.cos(phi);

}


const fondoGeometry =
    new THREE.BufferGeometry();


fondoGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(

        posicionesFondo,

        3

    )

);


const fondoMaterial =
    new THREE.PointsMaterial({

        color:
            0xffffff,

        size:
            1.8,

        transparent:
            true,

        opacity:
            .75

    });


const fondo =
    new THREE.Points(

        fondoGeometry,

        fondoMaterial

    );


escena.add(
    fondo
);


/* ========================================
   GALAXIA ESPIRAL
======================================== */

const galaxia =
    new THREE.Group();


escena.add(
    galaxia
);


const cantidadGalaxia =
    4500;


const posicionesGalaxia =
    new Float32Array(

        cantidadGalaxia * 3

    );


for (

    let i = 0;

    i < cantidadGalaxia;

    i++

) {

    const radio =

        Math.pow(
            Math.random(),
            .55
        ) * 560;


    const brazos =
        5;


    const brazo =

        Math.floor(

            Math.random() *
            brazos

        );


    const angulo =

        (brazo / brazos) *
        Math.PI * 2 +

        radio * .018;


    const desviacion =

        (Math.random() - .5) *
        75;


    posicionesGalaxia[i * 3] =

        Math.cos(angulo) *
        radio +
        desviacion;


    posicionesGalaxia[i * 3 + 1] =

        (Math.random() - .5) *
        45;


    posicionesGalaxia[i * 3 + 2] =

        Math.sin(angulo) *
        radio +
        desviacion;

}


const galaxiaGeometry =
    new THREE.BufferGeometry();


galaxiaGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(

        posicionesGalaxia,

        3

    )

);


const galaxiaMaterial =
    new THREE.PointsMaterial({

        color:
            0x7abfff,

        size:
            2.4,

        transparent:
            true,

        opacity:
            .7

    });


const particulasGalaxia =
    new THREE.Points(

        galaxiaGeometry,

        galaxiaMaterial

    );


galaxia.add(
    particulasGalaxia
);


/* ========================================
   HALO
======================================== */

function crearHalo() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        128;

    canvas.height =
        128;


    const contexto =
        canvas.getContext(
            "2d"
        );


    const gradiente =
        contexto.createRadialGradient(

            64,
            64,
            0,

            64,
            64,
            64

        );


    gradiente.addColorStop(

        0,
        "rgba(255,255,255,1)"

    );


    gradiente.addColorStop(

        .08,
        "rgba(255,255,255,1)"

    );


    gradiente.addColorStop(

        .25,
        "rgba(130,210,255,.9)"

    );


    gradiente.addColorStop(

        .55,
        "rgba(30,130,255,.3)"

    );


    gradiente.addColorStop(

        1,
        "rgba(0,0,0,0)"

    );


    contexto.fillStyle =
        gradiente;


    contexto.fillRect(

        0,
        0,
        128,
        128

    );


    return new THREE.CanvasTexture(
        canvas
    );

}


const texturaHalo =
    crearHalo();


/* ========================================
   CORAZÓN DE PARTÍCULAS
======================================== */

const cantidadCorazon =
    9000;


const posicionesCorazon =
    new Float32Array(

        cantidadCorazon * 3

    );


const posicionesInicio =
    new Float32Array(

        cantidadCorazon * 3

    );


const posicionesFinal =
    new Float32Array(

        cantidadCorazon * 3

    );


for (

    let i = 0;

    i < cantidadCorazon;

    i++

) {

    /*
       CORAZÓN FINAL

       Se encuentra arriba
       del planeta.
    */

    const t =
        Math.random() *
        Math.PI * 2;


    const escala =
        5.7 +
        Math.random() * .8;


    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        13 *
            Math.cos(t)

        - 5 *
            Math.cos(2 * t)

        - 2 *
            Math.cos(3 * t)

        - Math.cos(4 * t);


    const z =
        (Math.random() - .5) *
        30;


    /*
       El corazón estará
       aproximadamente 280
       unidades sobre el planeta.
    */

    posicionesFinal[i * 3] =
        x * escala;


    posicionesFinal[i * 3 + 1] =
        y * escala + 270;


    posicionesFinal[i * 3 + 2] =
        z;


    /*
       POSICIÓN INICIAL

       Todas las partículas
       nacen cerca del planeta.
    */

    const angulo =
        Math.random() *
        Math.PI * 2;


    const radio =
        Math.random() *
        55;


    posicionesInicio[i * 3] =

        Math.cos(angulo) *
        radio;


    posicionesInicio[i * 3 + 1] =

        50 +
        Math.random() * 40;


    posicionesInicio[i * 3 + 2] =

        Math.sin(angulo) *
        radio;

    
    /*
       Comenzamos desde
       la posición del planeta.
    */

    posicionesCorazon[i * 3] =
        posicionesInicio[i * 3];


    posicionesCorazon[i * 3 + 1] =
        posicionesInicio[i * 3 + 1];


    posicionesCorazon[i * 3 + 2] =
        posicionesInicio[i * 3 + 2];

}


const corazonGeometry =
    new THREE.BufferGeometry();


corazonGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(

        posicionesCorazon,

        3

    )

);


const corazonMaterial =
    new THREE.PointsMaterial({

        color:
            0x66cfff,

        size:
            2.4,

        transparent:
            true,

        opacity:
            0,

        blending:
            THREE.AdditiveBlending,

        depthWrite:
            false

    });


const corazon =
    new THREE.Points(

        corazonGeometry,

        corazonMaterial

    );


escena.add(
    corazon
);


/* ========================================
   HALO DEL CORAZÓN
======================================== */

const haloCorazon =
    new THREE.Sprite(

        new THREE.SpriteMaterial({

            map:
                texturaHalo,

            color:
                0x2aa8ff,

            transparent:
                true,

            opacity:
                0,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        })

    );


haloCorazon.position.set(

    0,
    300,
    0

);


haloCorazon.scale.set(

    550,
    550,
    1

);


escena.add(
    haloCorazon
);


/* ========================================
   PARTÍCULAS EXTRA DEL EFECTO
======================================== */

const cantidadExplosion =
    2500;


const posicionesExplosion =
    new Float32Array(

        cantidadExplosion * 3

    );


const velocidadesExplosion =
    new Float32Array(

        cantidadExplosion * 3

    );


for (

    let i = 0;

    i < cantidadExplosion;

    i++

) {

    const angulo =
        Math.random() *
        Math.PI * 2;


    const radio =
        Math.random() *
        45;


    posicionesExplosion[i * 3] =

        Math.cos(angulo) *
        radio;


    posicionesExplosion[i * 3 + 1] =

        60 +
        Math.random() *
        50;


    posicionesExplosion[i * 3 + 2] =

        Math.sin(angulo) *
        radio;


    velocidadesExplosion[i * 3] =

        (Math.random() - .5) *
        .8;


    velocidadesExplosion[i * 3 + 1] =

        .4 +
        Math.random() *
        1.5;


    velocidadesExplosion[i * 3 + 2] =

        (Math.random() - .5) *
        .8;

}


const explosionGeometry =
    new THREE.BufferGeometry();


explosionGeometry.setAttribute(

    "position",

    new THREE.BufferAttribute(

        posicionesExplosion,

        3

    )

);


const explosionMaterial =
    new THREE.PointsMaterial({

        color:
            0x8ddcff,

        size:
            2,

        transparent:
            true,

        opacity:
            0,

        blending:
            THREE.AdditiveBlending,

        depthWrite:
            false

    });


const explosion =
    new THREE.Points(

        explosionGeometry,

        explosionMaterial

    );


escena.add(
    explosion
);


/* ========================================
   FOTOS ORBITALES
======================================== */

const nombresFotos = [

    "foto1.jpg",
    "foto2.jpg",
    "foto3.jpg",
    "foto4.jpg",
    "foto5.jpg",
    "foto6.jpg"

];


const datosFotos = [

    {
        radio: 300,

        escala: 1
    },

    {
        radio: 420,

    },

    },

    },

    },

    {

    },

    },

    {

    },

    {
        radio: 280,

    },

    {
        radio: 530,

    },

    {
        radio: 680,
        altura: 220,

    },

    {
        radio: 820,
        altura: -220,
        velocidad: .0004,
        escala: .65
    },

    {
        radio: 390,
        altura: 300,
        velocidad: .0013,
        escala: .92
    },

/* ========================================
   RAYCASTER
======================================== */

const raycaster =
    new THREE.Raycaster();


const mouse =
    new THREE.Vector2();


function obtenerMouse(event) {

    mouse.x =

        (event.clientX /
        window.innerWidth) *
        2 - 1;


    mouse.y =

        -(event.clientY /
        window.innerHeight) *
        2 + 1;

}


/* ========================================
   MENSAJE
======================================== */

const pantallaMensaje =
    document.getElementById(
        "mensajePantalla"
    );


const textoMensaje =
    document.getElementById(
        "textoMensaje"
    );


function abrirMensaje(texto) {

    textoMensaje.innerText =
        texto;


    pantallaMensaje.classList.add(
        "visible"
    );


    controles.enabled =
        false;

}


/* ========================================
   TOQUE
======================================== */

renderer.domElement.addEventListener(

    "pointerdown",

    function(event) {

        obtenerMouse(event);


        raycaster.setFromCamera(

            mouse,

            camara

        );


        const objetos =
            raycaster.intersectObjects(

                estrellasEspeciales,

                true

            );


        if (
            objetos.length > 0
        ) {

            let estrella =
                objetos[0].object;


            while (

                estrella.parent &&

                !estrella.userData.texto

            ) {

                estrella =
                    estrella.parent;

            }


            if (
                estrella.userData.texto
            ) {

                abrirMensaje(

                    estrella.userData.texto

                );

            }

        }

    }

);

======================================== */

document
    .getElementById(
        "cerrarMensaje"
    )

        "click",

        function() {

            pantallaMensaje
                .classList
                .remove(
                    "visible"
                );


            controles.enabled =
                true;

        }

    );


window.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Escape"
        ) {

            pantallaMensaje
                .classList
                .remove(
                    "visible"
                );


            controles.enabled =
                true;

        }

    }

);


/* ========================================
   ANIMACIÓN DEL CORAZÓN
======================================== */

const reloj =
    new THREE.Clock();


const duracionCiclo =
    14;


function animar() {

    requestAnimationFrame(
        animar
    );


    const tiempo =
        reloj.getElapsedTime();


    /*
       CICLO DE 14 SEGUNDOS

       0 - 2:
       Planeta normal.

       2 - 5:
       Partículas salen del planeta.

       5 - 8:
       El corazón se forma.

       8 - 11:
       Corazón formado.

       11 - 14:
       Se dispersa.

       Después vuelve a empezar.
    */

    const ciclo =
        tiempo % duracionCiclo;


    /* ========================================
       PLANETA
    ======================================== */

    if (planeta) {

        planeta.rotation.y =
            tiempo * .08;

    }


    /* ========================================
       ATMÓSFERA
    ======================================== */

    const escalaAtmosfera =

        1 +

        Math.sin(
            tiempo * 1.3
        ) * .018;


    atmosfera.scale.setScalar(
        escalaAtmosfera
    );


    /* ========================================
       ANILLO
    ======================================== */

    anillo.rotation.z =
        tiempo * .12;


    /* ========================================
       GALAXIA
    ======================================== */

    galaxia.rotation.y =
        tiempo * .018;


    particulasGalaxia.rotation.y =
        tiempo * .006;


    fondo.rotation.y =
        tiempo * .0015;


    /* ========================================
       EFECTO DEL CORAZÓN
    ======================================== */

    let progreso = 0;

    let opacidad = 0;


    if (
        ciclo < 2
    ) {

        progreso = 0;

        opacidad = 0;

    }


    else if (
        ciclo < 5
    ) {

        progreso =
            (ciclo - 2) / 3;

        opacidad =
            progreso;

    }


    else if (
        ciclo < 8
    ) {

        progreso = 1;

        opacidad = 1;

    }


    else if (
        ciclo < 11
    ) {

        progreso = 1;

        opacidad = 1;

    }


    else {

        progreso =
            1 -
            ((ciclo - 11) / 3);

        opacidad =
            progreso;

    }


    /*
       Suavizamos la aparición.
    */

    const suavizado =
        progreso *
        progreso *
        (3 - 2 * progreso);


    const posiciones =
        corazonGeometry
            .attributes
            .position
            .array;


    for (

        let i = 0;

        i < cantidadCorazon;

        i++

    ) {

        const indice =
            i * 3;


        /*
           Movimiento desde el planeta
           hacia la forma final.
        */

        posiciones[indice] =

            posicionesInicio[indice] *
            (1 - suavizado)

            +

            posicionesFinal[indice] *
            suavizado;


        posiciones[indice + 1] =

            posicionesInicio[indice + 1] *
            (1 - suavizado)

            +

            posicionesFinal[indice + 1] *
            suavizado;


        posiciones[indice + 2] =

            posicionesInicio[indice + 2] *
            (1 - suavizado)

            +

            posicionesFinal[indice + 2] *
            suavizado;

    }


    corazonGeometry
        .attributes
        .position
        .needsUpdate =
        true;


    corazonMaterial.opacity =
        opacidad;


    /*
       Pequeña vibración del corazón.
    */

    if (
        progreso > .9
    ) {

        const latido =
            1 +

            Math.sin(
                tiempo * 2.5
            ) * .035;


        corazon.scale.set(

            latido,

            latido,

            latido

        );

    }


    /*
       Halo del corazón.
    */

    haloCorazon.material.opacity =

        opacidad * .22;


    haloCorazon.scale.set(

        500 +
        opacidad * 100,

        500 +
        opacidad * 100,

        1

    );


    /*
       Partículas que salen
       disparadas del planeta.
    */

    const posicionesExp =
        explosionGeometry
            .attributes
            .position
            .array;


    let explosionOpacidad = 0;


    if (
        ciclo >= 2 &&
        ciclo < 8
    ) {

        explosionOpacidad =

            Math.sin(
                ((ciclo - 2) / 6) *
                Math.PI
            );

    }


    for (

        let i = 0;

        i < cantidadExplosion;

        i++

    ) {

        const indice =
            i * 3;


        posicionesExp[indice] =

            posicionesExplosion[indice]

            +

            velocidadesExplosion[indice] *
            Math.max(
                0,
                ciclo - 2
            ) *
            18;


        posicionesExp[indice + 1] =

            posicionesExplosion[indice + 1]

            +

            velocidadesExplosion[indice + 1] *
            Math.max(
                0,
                ciclo - 2
            ) *
            18;


        posicionesExp[indice + 2] =

            posicionesExplosion[indice + 2]

            +

            velocidadesExplosion[indice + 2] *
            Math.max(
                0,
                ciclo - 2
            ) *
            18;

    }


    explosionGeometry
        .attributes
        .position
        .needsUpdate =
        true;


    explosionMaterial.opacity =
        explosionOpacidad;


    /* ========================================
       FOTOS
    ======================================== */

    fotosObjetos.forEach(

        (foto, indice) => {

            foto.userData.angulo +=
                foto.userData.velocidad;


            const angulo =
                foto.userData.angulo;


            const radio =
                foto.userData.radio;


            const x =
                Math.cos(angulo) *
                radio;


            const z =
                Math.sin(angulo) *
                radio;


            const y =

                foto.userData.altura +

                Math.sin(
                    angulo
                ) *

                radio *

                .12;


            foto.position.set(

                x,
                y,
                z

            );


            foto.lookAt(
                camara.position
            );


            const pulso =

                1 +

                Math.sin(

                    tiempo * 1.2 +
                    indice

                ) * .06;


            foto.userData.halo
                .scale.set(

                    100 * pulso,

                    100 * pulso,

                    1

                );

        }

    );


    /* ========================================
       ESTRELLAS
    ======================================== */

    estrellasEspeciales.forEach(

        (estrella, indice) => {

            const pulso =

                1 +

                Math.sin(

                    tiempo * 2.2 +
                    indice

                ) *

                .18;


            estrella.userData.halo
                .scale.set(

                    45 * pulso,

                    45 * pulso,

                    1

                );


            estrella.userData.nucleo
                .scale.setScalar(
                    pulso
                );


            estrella.userData.cruz
                .scale.setScalar(
                    pulso
                );


            estrella.rotation.z =

                tiempo *

                (.2 + indice * .01);

        }

    );


    /* ========================================
       CONTROLES
    ======================================== */

    controles.update();


    renderer.render(

        escena,

        camara

    );

}


animar();


/* ========================================
   RESPONSIVE
======================================== */

window.addEventListener(

    "resize",

    function() {

        camara.aspect =

            window.innerWidth /
            window.innerHeight;


        camara.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>
