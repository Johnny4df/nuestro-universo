<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestro Universo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #contenedor {
            width: 100vw;
            height: 100vh;
        }

        /* TÍTULO */

        #titulo {
            position: fixed;

            top: 35px;
            left: 0;

            width: 100%;

            text-align: center;

            color: white;

            z-index: 10;

            pointer-events: none;

            text-shadow:
                0 0 10px #ffffff,
                0 0 25px #6969ff;
        }

        #titulo h1 {
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 8px;
        }

        #titulo p {
            margin-top: 10px;
            font-size: 13px;
            opacity: .7;
            letter-spacing: 3px;
        }

        /* MENSAJE */

        #mensaje {
            position: fixed;

            left: 50%;
            bottom: 40px;

            transform: translateX(-50%);

            padding: 15px 25px;

            max-width: 450px;

            color: white;

            background: rgba(5, 5, 20, .75);

            border: 1px solid rgba(255,255,255,.3);

            border-radius: 15px;

            backdrop-filter: blur(10px);

            text-align: center;

            opacity: 0;

            transition: .4s;

            pointer-events: none;

            z-index: 20;
        }

        #mensaje.visible {
            opacity: 1;
        }

        /* AYUDA */

        #ayuda {
            position: fixed;

            right: 20px;
            bottom: 20px;

            color: white;

            font-size: 11px;

            opacity: .4;

            z-index: 10;
        }

    </style>
</head>

<body>

    <div id="contenedor"></div>


    <div id="titulo">

        <h1>NUESTRO UNIVERSO</h1>

        <p>Entre millones de estrellas, siempre te elegiría a ti</p>

    </div>


    <div id="mensaje"></div>


    <div id="ayuda">
        Arrastra para girar · Rueda para acercarte
    </div>


    <!-- THREE.JS -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <script type="module">

        import * as THREE from "three";

        import { OrbitControls }
        from "three/addons/controls/OrbitControls.js";


        // ==========================================
        // ESCENA
        // ==========================================

        const escena = new THREE.Scene();

        escena.background = new THREE.Color(0x000005);

        escena.fog = new THREE.FogExp2(
            0x000005,
            0.0007
        );


        // ==========================================
        // CÁMARA
        // ==========================================

        const camara = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            5000
        );

        camara.position.set(
            0,
            180,
            650
        );


        // ==========================================
        // RENDERER WEBGL
        // ==========================================

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        document
            .getElementById("contenedor")
            .appendChild(renderer.domElement);


        // ==========================================
        // CONTROLES 360°
        // ==========================================

        const controles =
            new OrbitControls(
                camara,
                renderer.domElement
            );

        controles.enableDamping = true;

        controles.dampingFactor = .04;

        controles.minDistance = 180;

        controles.maxDistance = 1200;

        controles.enablePan = false;

        controles.autoRotate = true;

        controles.autoRotateSpeed = .25;


        // ==========================================
        // LUCES
        // ==========================================

        const luz = new THREE.PointLight(
            0xffffff,
            5,
            1000
        );

        escena.add(luz);


        // ==========================================
        // PLANETA CENTRAL
        // ==========================================

        const texturaPlaneta =
            new THREE.TextureLoader().load(
                "fotos/planeta.jpg"
            );


        const geometriaPlaneta =
            new THREE.SphereGeometry(
                70,
                64,
                64
            );


        const materialPlaneta =
            new THREE.MeshStandardMaterial({

                map: texturaPlaneta,

                roughness: .8,

                metalness: .1

            });


        const planeta =
            new THREE.Mesh(
                geometriaPlaneta,
                materialPlaneta
            );


        escena.add(planeta);


        // ==========================================
        // ATMÓSFERA
        // ==========================================

        const atmosfera =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    74,
                    64,
                    64
                ),

                new THREE.MeshBasicMaterial({

                    color: 0x6677ff,

                    transparent: true,

                    opacity: .12,

                    side: THREE.BackSide

                })

            );


        escena.add(atmosfera);


        // ==========================================
        // ANILLOS
        // ==========================================

        const anillo =
            new THREE.Mesh(

                new THREE.RingGeometry(
                    105,
                    125,
                    128
                ),

                new THREE.MeshBasicMaterial({

                    color: 0xaaaaff,

                    transparent: true,

                    opacity: .55,

                    side: THREE.DoubleSide

                })

            );


        anillo.rotation.x =
            Math.PI / 2.5;


        escena.add(anillo);


        // ==========================================
        // ESTRELLAS DEL FONDO
        // ==========================================

        const cantidadEstrellas = 7000;


        const posiciones =
            new Float32Array(
                cantidadEstrellas * 3
            );


        for (
            let i = 0;
            i < cantidadEstrellas;
            i++
        ) {

            const radio =
                900 + Math.random() * 1800;


            const theta =
                Math.random() * Math.PI * 2;


            const phi =
                Math.acos(
                    2 * Math.random() - 1
                );


            posiciones[i * 3] =
                radio *
                Math.sin(phi) *
                Math.cos(theta);


            posiciones[i * 3 + 1] =
                radio *
                Math.sin(phi) *
                Math.sin(theta);


            posiciones[i * 3 + 2] =
                radio *
                Math.cos(phi);

        }


        const estrellasGeometry =
            new THREE.BufferGeometry();


        estrellasGeometry.setAttribute(

            "position",

            new THREE.BufferAttribute(
                posiciones,
                3
            )

        );


        const estrellasMaterial =
            new THREE.PointsMaterial({

                color: 0xffffff,

                size: 2,

                transparent: true,

                opacity: .8

            });


        const estrellasFondo =
            new THREE.Points(

                estrellasGeometry,

                estrellasMaterial

            );


        escena.add(estrellasFondo);


        // ==========================================
        // GALAXIA
        // ==========================================

        const galaxia =
            new THREE.Group();


        escena.add(galaxia);


        const cantidadGalaxia = 3500;


        const posicionesGalaxia =
            new Float32Array(
                cantidadGalaxia * 3
            );


        for (
            let i = 0;
            i < cantidadGalaxia;
            i++
        ) {

            const radio =
                Math.pow(
                    Math.random(),
                    .55
                ) * 550;


            const brazos = 5;


            const brazo =
                Math.floor(
                    Math.random() * brazos
                );


            const angulo =
                (brazo / brazos) *
                Math.PI * 2
                +
                radio * .018;


            const variacion =
                (Math.random() - .5) *
                80;


            posicionesGalaxia[i * 3] =
                Math.cos(angulo) *
                radio +
                variacion;


            posicionesGalaxia[i * 3 + 1] =
                (Math.random() - .5) *
                45;


            posicionesGalaxia[i * 3 + 2] =
                Math.sin(angulo) *
                radio +
                variacion;

        }


        const galaxiaGeometry =
            new THREE.BufferGeometry();


        galaxiaGeometry.setAttribute(

            "position",

            new THREE.BufferAttribute(
                posicionesGalaxia,
                3
            )

        );


        const galaxiaMaterial =
            new THREE.PointsMaterial({

                color: 0xaaaaff,

                size: 2.5,

                transparent: true,

                opacity: .75

            });


        const particulasGalaxia =
            new THREE.Points(

                galaxiaGeometry,

                galaxiaMaterial

            );


        galaxia.add(
            particulasGalaxia
        );


        // ==========================================
        // FOTOS
        // ==========================================

        const fotos = [

            {
                archivo: "fotos/foto1.jpg",
                posicion: [-300, 120, 100]
            },

            {
                archivo: "fotos/foto2.jpg",
                posicion: [280, 80, -100]
            },

            {
                archivo: "fotos/foto3.jpg",
                posicion: [100, -160, 280]
            },

            {
                archivo: "fotos/foto4.jpg",
                posicion: [-250, -100, -220]
            },

            {
                archivo: "fotos/foto5.jpg",
                posicion: [350, -80, 180]
            },

            {
                archivo: "fotos/foto6.jpg",
                posicion: [-100, 220, -300]
            }

        ];


        const loader =
            new THREE.TextureLoader();


        fotos.forEach((foto) => {

            const textura =
                loader.load(
                    foto.archivo
                );


            const geometria =
                new THREE.PlaneGeometry(
                    90,
                    90
                );


            const material =
                new THREE.MeshBasicMaterial({

                    map: textura,

                    side: THREE.DoubleSide,

                    transparent: true

                });


            const imagen =
                new THREE.Mesh(
                    geometria,
                    material
                );


            imagen.position.set(
                foto.posicion[0],
                foto.posicion[1],
                foto.posicion[2]
            );


            // Que siempre mire hacia la cámara

            imagen.lookAt(camara.position);


            escena.add(imagen);


            // Marco luminoso

            const marco =
                new THREE.LineSegments(

                    new THREE.EdgesGeometry(
                        geometria
                    ),

                    new THREE.LineBasicMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: .6
                    })

                );


            imagen.add(marco);

        });


        // ==========================================
        // ESTRELLAS CON FRASES
        // ==========================================

        const recuerdos = [

            {
                posicion: [-220, 100, 100],
                texto:
                "Desde que llegaste, mi universo cambió."
            },

            {
                posicion: [230, 140, -120],
                texto:
                "Entre millones de estrellas, te elegiría a ti."
            },

            {
                posicion: [300, -80, 150],
                texto:
                "Contigo hasta los días normales se vuelven recuerdos."
            },

            {
                posicion: [-280, -120, -160],
                texto:
                "Mi lugar favorito siempre termina siendo contigo."
            },

            {
                posicion: [80, 220, -220],
                texto:
                "Gracias por formar parte de mi universo."
            },

            {
                posicion: [-50, -220, 250],
                texto:
                "Todavía nos quedan muchísimas historias por vivir."
            }

        ];


        recuerdos.forEach((recuerdo) => {

            const geometria =
                new THREE.SphereGeometry(
                    6,
                    16,
                    16
                );


            const material =
                new THREE.MeshBasicMaterial({
                    color: 0xffffff
                });


            const estrella =
                new THREE.Mesh(
                    geometria,
                    material
                );


            estrella.position.set(
                recuerdo.posicion[0],
                recuerdo.posicion[1],
                recuerdo.posicion[2]
            );


            estrella.userData.texto =
                recuerdo.texto;


            galaxia.add(
                estrella
            );

        });


        // ==========================================
        // INTERACCIÓN
        // ==========================================

        const raycaster =
            new THREE.Raycaster();


        const mouse =
            new THREE.Vector2();


        const mensaje =
            document.getElementById(
                "mensaje"
            );


        window.addEventListener(
            "click",
            function(event) {

                mouse.x =
                    (event.clientX /
                    window.innerWidth) * 2 - 1;


                mouse.y =
                    -(event.clientY /
                    window.innerHeight) * 2 + 1;


                raycaster.setFromCamera(
                    mouse,
                    camara
                );


                const objetos =
                    raycaster.intersectObjects(
                        galaxia.children,
                        true
                    );


                for (
                    const objeto of objetos
                ) {

                    if (
                        objeto.object.userData
                        .texto
                    ) {

                        mensaje.innerText =
                            objeto.object.userData.texto;


                        mensaje.classList.add(
                            "visible"
                        );


                        setTimeout(() => {

                            mensaje.classList.remove(
                                "visible"
                            );

                        }, 5000);


                        break;

                    }

                }

            }
        );


        // ==========================================
        // ANIMACIÓN
        // ==========================================

        const reloj =
            new THREE.Clock();


        function animar() {

            requestAnimationFrame(
                animar
            );


            const tiempo =
                reloj.getElapsedTime();


            planeta.rotation.y =
                tiempo * .08;


            anillo.rotation.z =
                tiempo * .15;


            galaxia.rotation.y =
                tiempo * .025;


            estrellasFondo.rotation.y =
                tiempo * .002;


            particulasGalaxia.rotation.y =
                tiempo * .008;


            atmosfera.scale.setScalar(
                1 +
                Math.sin(tiempo * 1.5) *
                .015
            );


            controles.update();


            renderer.render(
                escena,
                camara
            );

        }


        animar();


        // ==========================================
        // RESPONSIVE
        // ==========================================

        window.addEventListener(
            "resize",
            function() {

                camara.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camara.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

    </script>

</body>
</html>
